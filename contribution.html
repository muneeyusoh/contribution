<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>สมทบเงินกองทุน | CWF</title>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="background:#F8FAFC; font-family:'Prompt', sans-serif;">

<div id="loader" style="position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:99;display:flex;justify-content:center;align-items:center;"><h4>ตรวจสอบยอดค้างชำระ...</h4></div>

<div class="container p-4" style="max-width:500px;">
  <div class="card border-0 shadow-sm rounded-4 p-4 mb-3">
    <h5 class="fw-bold text-success text-center mb-3">แจ้งชำระเงินสมทบรายปี</h5>
    <div class="alert alert-info py-2 text-center fw-bold">ยอดที่ต้องสมทบ: <span id="debtText" class="text-danger fs-5">0</span> บาท</div>
    
    <form onsubmit="submitContrib(event)">
      <input type="hidden" name="action" value="handleContribution">
      <input type="hidden" id="uid" name="uid"> <input type="hidden" id="fullName" name="fullName">
      
      <label class="small fw-bold">จำนวนเงินที่โอน</label>
      <input type="number" id="amount" name="amount" class="form-control mb-3" required>
      
      <label class="small fw-bold">ช่องทาง</label>
      <select class="form-select mb-3" name="paymentMethod" required>
        <option value="โอนเงินผ่านธนาคาร">โอนเงินเข้าบัญชีกองทุน</option>
        <option value="ชำระผ่านกรรมการ">ฝากเงินสดผ่านกรรมการศูนย์</option>
      </select>
      
      <label class="small fw-bold">แนบสลิป (ถ้ามี)</label>
      <input type="file" class="form-control mb-4" accept="image/*" onchange="convertImg(this)">
      <input type="hidden" id="slipBase64" name="slipBase64"><input type="hidden" id="slipFileName" name="slipFileName">
      
      <button type="submit" class="btn btn-success w-100 rounded-pill py-2 fw-bold" id="submitBtn">ยืนยันการทำรายการ</button>
    </form>
  </div>
</div>

<script>
  const LIFF_ID = "2010764982-BltKP85l"; 
  const GAS_API_URL = "https://script.google.com/macros/s/AKfycbw8ohbEXMSqCKzwTHeCem8pxpM_NcSA_twE3r4QU1HvsNZjtlEydGMoV6ffP1yBUOk/exec";

  document.addEventListener("DOMContentLoaded", async () => {
    await liff.init({ liffId: LIFF_ID });
    if(liff.isLoggedIn()) {
      const profile = await liff.getProfile(); document.getElementById('uid').value = profile.userId;
      const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify({ action: "checkStatus", uid: profile.userId }) }).then(r=>r.json());
      document.getElementById('loader').style.display = 'none';
      if(res.status === 'registered') {
        document.getElementById('fullName').value = res.memberData.fullName;
        document.getElementById('debtText').innerText = res.memberData.outstandingBalance;
        document.getElementById('amount').max = res.memberData.outstandingBalance;
        if(res.memberData.outstandingBalance <= 0) {
          Swal.fire('ยอดเยี่ยม', 'คุณสมทบครบถ้วนแล้วในปีนี้', 'success').then(()=>liff.closeWindow());
        }
      }
    } else liff.login();
  });

  function convertImg(input) { const f = input.files[0]; if(f){ document.getElementById('slipFileName').value = f.name; const r = new FileReader(); r.onload=e=>document.getElementById('slipBase64').value=e.target.result; r.readAsDataURL(f); } }
  
  async function submitContrib(e) {
    e.preventDefault(); const btn = document.getElementById('submitBtn'); btn.disabled = true; btn.innerText = 'กำลังตรวจสอบสลิป...';
    const res = await fetch(GAS_API_URL, { method: "POST", body: JSON.stringify(Object.fromEntries(new FormData(e.target))) }).then(r=>r.json());
    if(res.status==='success') Swal.fire('สำเร็จ', 'ส่งหลักฐานเรียบร้อย กรุณารออนุมัติ', 'success').then(()=>liff.closeWindow());
    else { Swal.fire('Error', res.message, 'error'); btn.disabled = false; btn.innerText = 'ยืนยัน'; }
  }
</script>
</body>
</html>
